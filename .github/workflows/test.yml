name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in both Dockerfiles: tests run on what production runs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm test
        working-directory: shared

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api

  # The image the server builds has to build, and the stack has to boot and answer.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up -d
      - name: the API answers on its published port
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8083/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8083/api/health | grep -q '"ok":true'
      - if: failure()
        run: docker compose logs

name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in both Dockerfiles: tests run on what production runs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api

  # The images the server builds: both have to build, and the stack has to boot and answer.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up -d
      - name: the app and the API answer through nginx
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8081/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8081/ | grep -q '<title>mySleep</title>'
          ! curl -fsS http://127.0.0.1:8081/sw.js | grep -q '__BUILD__'
      - if: failure()
        run: docker compose logs

name: mysleep

services:
  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - PORT=3000
    # localhost only: Tailscale serve puts HTTPS in front (docs/dev/MVP.md)
    ports:
      - "127.0.0.1:${API_PORT:-8083}:3000"
    volumes:
      - ./data:/data    # users, devices, nights, logs, secret: BACK THIS UP
